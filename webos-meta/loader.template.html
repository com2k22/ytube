<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ytube</title>
    <style>
      /* Trang này chỉ hiện trong khoảnh khắc app đang mở — cố ý làm nền tối trùng màu
         nền app (#0e0f13) để bé không thấy chớp trắng khó chịu lúc chuyển trang. */
      html, body {
        margin: 0;
        height: 100%;
        background: #0e0f13;
        color: #f2f3f5;
        font-family: ui-rounded, 'Segoe UI', Roboto, system-ui, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 60px;
        box-sizing: border-box;
      }
      /* Cỡ chữ to hẳn — trang này hiện trên TV, nhìn từ khoảng cách 3-4m. */
      .logo { font-size: 76px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; }
      .logo .play {
        display: inline-flex; align-items: center; justify-content: center;
        width: 104px; height: 74px; background: #ff0000; color: #fff;
        border-radius: 20px; font-size: 40px; padding-left: 8px;
        vertical-align: middle; margin-right: 18px;
      }
      .msg { font-size: 32px; opacity: 0.75; margin-top: 22px; line-height: 1.6; }
      .hint { font-size: 24px; opacity: 0.5; margin-top: 18px; line-height: 1.6; max-width: 1100px; }
      .retry {
        margin-top: 40px; padding: 22px 52px; font-size: 30px; font-weight: 800;
        border: none; border-radius: 18px; background: #7c9cff; color: #0e0f13; cursor: pointer;
      }
      .retry:focus { outline: 6px solid #fff; outline-offset: 4px; }
      .hidden { display: none; }
      .dots::after {
        content: '';
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><span class="play">▶</span>Ytube</div>

      <div class="msg" id="loading">Đang mở Ytube<span class="dots"></span></div>

      <div class="msg hidden" id="offline">Không kết nối được mạng</div>
      <div class="hint hidden" id="offlineHint">
        TV cần có mạng Internet để mở Ytube. Kiểm tra lại Wi-Fi của TV rồi bấm "Thử lại".
      </div>
      <button class="retry hidden" id="retryBtn">Thử lại</button>
    </div>

    <script>
      // Link app thật (bản đang chạy trên Vercel) — scripts/prepare-webos.js tự điền vào
      // đây, lấy từ file webos-meta/tv-app-url.txt. KHÔNG sửa trực tiếp ở file này.
      var APP_URL = '__YTUBE_APP_URL__';

      var loadingEl = document.getElementById('loading');
      var offlineEl = document.getElementById('offline');
      var offlineHintEl = document.getElementById('offlineHint');
      var retryBtn = document.getElementById('retryBtn');

      function showOffline() {
        loadingEl.className = 'msg hidden';
        offlineEl.className = 'msg';
        offlineHintEl.className = 'hint';
        retryBtn.className = 'retry';
        retryBtn.focus();
      }

      function showLoading() {
        loadingEl.className = 'msg';
        offlineEl.className = 'msg hidden';
        offlineHintEl.className = 'hint hidden';
        retryBtn.className = 'retry hidden';
      }

      function go() {
        showLoading();
        // Gắn thêm dấu "?tv=1" vào link: đây là cách app biết CHẮC CHẮN nó đang chạy trên
        // TV để bật bộ giao diện phóng to (chữ to, thẻ video to, nhìn rõ từ 3-4m). Chắc
        // chắn hơn nhiều so với việc đoán qua thông tin trình duyệt của TV.
        var url = APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 'tv=1';
        // location.replace (thay vì location.href) để trang trung gian này KHÔNG nằm lại
        // trong lịch sử — nhờ vậy bé bấm nút "Back" trên điều khiển ở trang chủ app sẽ
        // thoát app luôn, thay vì quay ngược về trang "Đang mở Ytube" rồi kẹt vòng lặp.
        window.location.replace(url);
      }

      retryBtn.addEventListener('click', go);

      // Nếu TV đang mất mạng thì hiện thông báo dễ hiểu, thay vì để trình duyệt của TV
      // đẩy ra trang báo lỗi kỹ thuật khó hiểu. Khi có mạng lại thì tự vào app.
      window.addEventListener('online', go);

      if (navigator.onLine === false) {
        showOffline();
      } else {
        // Chờ 1 nhịp rất ngắn cho trang splash kịp vẽ ra, rồi mới chuyển — tránh màn hình
        // đen trơ trong lúc TV đang tải trang app.
        setTimeout(go, 250);
      }
    </script>
  </body>
</html>
