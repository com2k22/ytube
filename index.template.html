<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./webos/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ytube — cho Mina & Cốm</title>
    <meta name="theme-color" content="#0e0f13" />
    <!-- CSS được scripts/prepare-webos.js chèn thẳng vào đây, thay cho token dưới -->
    <style>__YTUBE_CSS__</style>
  </head>
  <body>
    <!-- QUAN TRỌNG: div id=root đứng TRƯỚC thẻ script phía dưới, để lúc code JS chạy
         tới dòng render vào #root, phần tử này chắc chắn đã tồn tại. -->
    <div id="root"></div>
    <!-- JS được scripts/prepare-webos.js chèn thẳng vào đây, thay cho token dưới.
         Bọc thêm 1 lớp DOMContentLoaded để an toàn tuyệt đối (dù div#root đã đứng
         trước rồi). Đây là 1 thẻ script cổ điển thường (không khai báo type module
         gì cả), chạy được trên mọi trình duyệt kể cả khi mở trực tiếp từ ổ đĩa. -->
    <script>document.addEventListener('DOMContentLoaded',function(){__YTUBE_JS__});</script>
  </body>
</html>
